# SPDX-License-Identifier: MIT

[package]
name = "shibahama-perf"
description = "Criterion performance harness for Shibahama."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "shibahama_perf"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
rand = "0.8.5"
shibahama-core.workspace = true
tempfile = "3.27.0"
time = "0.3.47"

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "write_latency"
harness = false

[[bench]]
name = "recall_latency"
harness = false

[[bench]]
name = "ingest_throughput"
harness = false

[[bench]]
name = "post_write_availability"
harness = false
