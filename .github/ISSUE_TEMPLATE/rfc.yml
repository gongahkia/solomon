name: RFC proposal
description: Propose a protocol, plugin API, security, theme, or governance change.
title: "rfc: "
labels:
  - kind/rfc
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One concrete proposal.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - wire protocol
        - plugin API
        - security
        - theme/rendering
        - governance
        - other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why this belongs in Shisa.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design sketch
      description: Proposed behavior, compatibility impact, and migration plan.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Rejected alternatives
      description: Options considered and why they are not enough.
    validations:
      required: true
