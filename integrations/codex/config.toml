[mcp_servers.shibahama]
command = "cargo"
args = [
  "run",
  "-q",
  "-p",
  "shibahama-cli",
  "--",
  "mcp",
  "--path",
  ".shibahama/codex.redb",
  "--dimensions",
  "2",
  "--scope-repository",
  "codex",
  "--scope-visibility",
  "repository",
  "--principal",
  "codex",
  "--actor",
  "human"
]
