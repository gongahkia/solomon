image:
  repository: ghcr.io/gongahkia/shibahama
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1
namespace: default

serviceAccount:
  create: true
  name: ""

storage:
  existingClaim: ""
  size: 10Gi
  storageClass: ""

secrets:
  existingSecret: ""
  encryptionKeyKey: encryption-key
  apiKeyKey: api-key

service:
  type: ClusterIP
  port: 8765

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

oidc:
  issuer: ""
  audience: ""
  principalClaim: sub
  caConfigMap: ""
  caKey: ca.crt

policy:
  namespace: default
  rbacEnforce: true
  rbacErasureMinRole: maintainer
  rbacPromotionMinRole: maintainer
  rateLimitRequestsPerWindow: 120
  rateLimitWindowSeconds: 60
  rateLimitBurst: 30
  corsOrigins: ""
  corsMethods: ""
  corsHeaders: ""
  corsAllowCredentials: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

networkPolicy:
  enabled: true
  ingressNamespaces: []
