name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: release-${{ hashFiles('build.zig.zon') }}

      - name: Check release reproducibility
        if: runner.os == 'Linux'
        run: bash .github/scripts/reproducibility-check.sh

      - run: zig build release

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          test -n "$MACOS_CERTIFICATE_P12"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          keychain="$RUNNER_TEMP/shisa-signing.keychain-db"
          cert="$RUNNER_TEMP/shisa-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$MACOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"

      - name: Codesign macOS binaries
        if: runner.os == 'macOS'
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -eu
          identity="${MACOS_CODESIGN_IDENTITY:-Developer ID Application}"
          for bin in zig-out/bin/shisa zig-out/bin/shisad zig-out/bin/shisa-supervisor; do
            codesign --force --timestamp --deep --options runtime --sign "$identity" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

      - name: Package artifact
        run: |
          set -eu
          os=$(printf "%s" "$RUNNER_OS" | tr "[:upper:]" "[:lower:]")
          arch=$(printf "%s" "$RUNNER_ARCH" | tr "[:upper:]" "[:lower:]")
          name="shisa-${GITHUB_REF_NAME}-${os}-${arch}"
          echo "SHISA_PACKAGE_NAME=$name" >> "$GITHUB_ENV"
          mkdir -p "dist/$name"
          cp zig-out/bin/shisa "dist/$name/"
          cp zig-out/bin/shisad "dist/$name/"
          cp zig-out/bin/shisa-supervisor "dist/$name/"
          mkdir -p "dist/$name/init"
          cp init/shisa.zsh "dist/$name/init/"
          cp init/shisa.bash "dist/$name/init/"
          cp init/shisa.fish "dist/$name/init/"
          cp init/shisa.nu "dist/$name/init/"
          cp init/shisa.ps1 "dist/$name/init/"
          cp -R themes "dist/$name/themes"
          cp -R examples "dist/$name/examples"
          cp LICENSE README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - name: Notarize and staple macOS artifact
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -eu
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials shisa-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          ditto -c -k --keepParent "dist/$SHISA_PACKAGE_NAME" "dist/$SHISA_PACKAGE_NAME.notary.zip"
          xcrun notarytool submit "dist/$SHISA_PACKAGE_NAME.notary.zip" --wait --keychain-profile shisa-notary
          hdiutil create -fs HFS+ -format UDZO -srcfolder "dist/$SHISA_PACKAGE_NAME" -volname "shisa-$GITHUB_REF_NAME" "dist/$SHISA_PACKAGE_NAME.dmg"
          xcrun notarytool submit "dist/$SHISA_PACKAGE_NAME.dmg" --wait --keychain-profile shisa-notary
          xcrun stapler staple "dist/$SHISA_PACKAGE_NAME.dmg"
          xcrun stapler validate "dist/$SHISA_PACKAGE_NAME.dmg"
          shasum -a 256 "dist/$SHISA_PACKAGE_NAME.dmg" > "dist/$SHISA_PACKAGE_NAME.dmg.sha256"
          rm -f "dist/$SHISA_PACKAGE_NAME.notary.zip"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.42.3

      - name: Generate SPDX SBOM
        run: |
          set -eu
          "${{ steps.syft.outputs.cmd }}" "dist/$SHISA_PACKAGE_NAME" \
            --source-name "$SHISA_PACKAGE_NAME" \
            --source-version "$GITHUB_REF_NAME" \
            -o "spdx-json=dist/$SHISA_PACKAGE_NAME.spdx.json"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign release files
        run: |
          set -eu
          for artifact in \
            "dist/$SHISA_PACKAGE_NAME.tar.gz" \
            "dist/$SHISA_PACKAGE_NAME.tar.gz.sha256" \
            "dist/$SHISA_PACKAGE_NAME.spdx.json" \
            "dist/$SHISA_PACKAGE_NAME.dmg" \
            "dist/$SHISA_PACKAGE_NAME.dmg.sha256"
          do
            test -f "$artifact" || continue
            cosign sign-blob --yes "$artifact" \
              --bundle "$artifact.sigstore.json" \
              --output-signature "$artifact.sig" \
              --output-certificate "$artifact.pem"
            cp "$artifact.pem" "$artifact.crt"
          done

      - name: Generate provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz.sha256
            dist/${{ env.SHISA_PACKAGE_NAME }}.spdx.json
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz.sigstore.json
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz.sha256.sigstore.json
            dist/${{ env.SHISA_PACKAGE_NAME }}.spdx.json.sigstore.json
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz.sig
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz.pem
            dist/${{ env.SHISA_PACKAGE_NAME }}.tar.gz.crt

      - uses: actions/upload-artifact@v4
        with:
          name: shisa-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.dmg
            dist/*.spdx.json
            dist/*.sigstore.json
            dist/*.sig
            dist/*.pem
            dist/*.crt
          if-no-files-found: error

  reproducibility:
    name: reproducibility / ubuntu-24.04 / ${{ matrix.slot }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slot:
          - first
          - second

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: repro-${{ matrix.slot }}-${{ hashFiles('build.zig.zon') }}

      - name: Check release reproducibility
        env:
          SHISA_REPRO_HASH_OUTPUT: repro-${{ matrix.slot }}.sha256
        run: bash .github/scripts/reproducibility-check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ matrix.slot }}
          path: repro-${{ matrix.slot }}.sha256
          if-no-files-found: error

  compare-reproducibility:
    name: reproducibility / compare
    runs-on: ubuntu-24.04
    needs:
      - reproducibility

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: repro
          pattern: reproducibility-*
          merge-multiple: true

      - name: Compare release hashes
        run: |
          set -eu
          first="repro/repro-first.sha256"
          second="repro/repro-second.sha256"
          test -s "$first"
          test -s "$second"
          diff -u "$first" "$second"

  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs:
      - build
      - compare-reproducibility

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Diff SBOMs against previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/sbom-release-diff.sh dist

      - name: Upload SBOM diff review
        uses: actions/upload-artifact@v4
        with:
          name: sbom-diff-${{ github.ref_name }}
          path: dist/sbom-diff
          if-no-files-found: error

      - name: Generate Rekor links
        run: bash .github/scripts/cosign-rekor-links.sh dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Manual v0 release. Artifacts, SHA-256 checksums, SPDX SBOMs, cosign bundles, and Rekor links are attached." \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/*.dmg \
            dist/*.dmg.sha256 \
            dist/*.spdx.json \
            dist/*.sigstore.json \
            dist/*.sig \
            dist/*.pem \
            dist/*.crt \
            dist/rekor-links.txt
