services:
  solomon-server:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install --yes --no-install-recommends build-essential &&
             rm -rf /var/lib/apt/lists/* &&
             pip install uv &&
             uv sync --locked --extra dev &&
             uv run uvicorn solomon.api.app:create_app --factory --host 0.0.0.0 --port 8140"
    volumes:
      - .:/app
      - solomon-data:/app/solomon-data
      - solomon-journal:/app/solomon-journal
    environment:
      SOLOMON_SKU: server
      SOLOMON_SERVER_API_KEY: "${SOLOMON_SERVER_API_KEY:?set SOLOMON_SERVER_API_KEY}"
      SOLOMON_ZERO_EGRESS_MODE: "false"
      SOLOMON_ALLOW_REMOTE_EGRESS: "${SOLOMON_ALLOW_REMOTE_EGRESS:-false}"
      SOLOMON_REMOTE_MODEL_URL: "${SOLOMON_REMOTE_MODEL_URL:-}"
      SOLOMON_BOUNDARY_BASE_URL: "${SOLOMON_BOUNDARY_BASE_URL:-in-process://solomon-boundary-engine}"
    ports:
      - "8140:8140"

volumes:
  solomon-data:
  solomon-journal:
