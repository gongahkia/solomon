{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "solomon.fullname" . }}-console
  labels:
    {{- include "solomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "solomon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "solomon.fullname" . }}-console
  labels:
    {{- include "solomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "solomon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "solomon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "solomon.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "solomon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "solomon.console.app:create_console_app", "--factory", "--host", "0.0.0.0", "--port", "8150"]
          ports:
            - name: http
              containerPort: 8150
              protocol: TCP
          env:
            {{- include "solomon.appEnvironment" . | nindent 12 }}
          volumeMounts:
            {{- include "solomon.appVolumeMounts" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID"]
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        {{- include "solomon.appVolumes" . | nindent 8 }}
{{- end }}
