name: release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'scripts/release-*.sh'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

env:
  RELEASE_VERSION: v0.0.0-dryrun.${{ github.run_number }}

jobs:
  compatibility:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - id: matrix
        run: |
          targets=$(go run ./cmd/release-compatibility)
          printf 'targets=%s\n' "$targets" >> "$GITHUB_OUTPUT"
  build:
    needs: compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility.outputs.targets) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - id: archive
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -buildvcs=false -mod=readonly -ldflags "-X main.version=$RELEASE_VERSION -X main.commit=$GITHUB_SHA" -o dist/solomon ./cmd/solomon
          extension=tar.gz
          if [ "${{ matrix.goos }}" = windows ]; then extension=zip; fi
          archive=$(sh scripts/release-name.sh "$RELEASE_VERSION" "${{ matrix.goos }}" "${{ matrix.goarch }}" "$extension")
          if [ "$extension" = zip ]; then
            sh scripts/release-zip.sh dist/solomon "dist/$archive" "${archive%.zip}"
          else
            sh scripts/release-archive.sh dist/solomon "dist/$archive" "${archive%.tar.gz}"
          fi
          printf 'path=%s\n' "dist/$archive" >> "$GITHUB_OUTPUT"
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - run: |
          archive='${{ steps.archive.outputs.path }}'
          case "$archive" in
            *.tar.gz) sbom="${archive%.tar.gz}.cdx.json" ;;
            *.zip) sbom="${archive%.zip}.cdx.json" ;;
            *) exit 2 ;;
          esac
          sh scripts/release-sbom.sh "$(go env GOPATH)/bin/cyclonedx-gomod" . "$sbom" "${{ matrix.goos }}" "${{ matrix.goarch }}"
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: |
          archive='${{ steps.archive.outputs.path }}'
          case "$archive" in
            *.tar.gz) audit="${archive%.tar.gz}.licenses.csv" ;;
            *.zip) audit="${archive%.zip}.licenses.csv" ;;
            *) exit 2 ;;
          esac
          sh scripts/release-license-audit.sh "$(go env GOPATH)/bin/go-licenses" . "$audit" "${{ matrix.goos }}" "${{ matrix.goarch }}"
      - run: |
          archive='${{ steps.archive.outputs.path }}'
          printf '{"dry_run":true}\n' > "$archive.sigstore.json"
          test -s "$archive.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
          if-no-files-found: error
  smoke:
    needs: [build, compatibility]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility.outputs.targets) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dry-run-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release
      - shell: bash
        run: |
          archive=$(find release -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          test -n "$archive"
          sh scripts/release-smoke-test.sh "$archive" "${{ matrix.goos }}" "${{ matrix.goarch }}" "$RELEASE_VERSION"
  bootstrap:
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          mkdir -p dist
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          printf '{"dry_run":true}\n' > dist/install.sh.sigstore.json
          printf '{"dry_run":true}\n' > dist/install.ps1.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-dry-run
          path: dist/install.*
          if-no-files-found: error
