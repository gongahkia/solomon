version = 1
theme = "./oh-my-posh-theme.toml"

# Oh My Posh left layout: path, git, python, status, executiontime
# Oh My Posh right layout: aws, battery
[prompt]
modules = ["cwd", "git_branch", "language_versions", "exit_status", "cmd_duration", "cloud_ctx"]

[modules.language_versions]
detect = ["python"]

# Unsupported Oh My Posh segments: battery
