x-solomon: &solomon
  build:
    context: .
  image: solomon:production
  init: true
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  tmpfs:
    - /tmp
  environment: &solomon-environment
    SOLOMON_SKU: server
    SOLOMON_SERVER_AUTH_MODE: legacy-api-key
    SOLOMON_SERVER_API_KEY_FILE: /run/secrets/solomon_server_api_key
    SOLOMON_CONTENT_ENCRYPTION_KEY_REF: ${SOLOMON_CONTENT_ENCRYPTION_KEY_REF:?set SOLOMON_CONTENT_ENCRYPTION_KEY_REF}
    SOLOMON_CONTENT_ENCRYPTION_KEY_FILE: /run/secrets/solomon_content_encryption_key
    SOLOMON_DATABASE_HOST: postgres
    SOLOMON_DATABASE_PORT: "5432"
    SOLOMON_DATABASE_NAME: solomon
    SOLOMON_DATABASE_USER: solomon
    POSTGRES_PASSWORD_FILE: /run/secrets/solomon_postgres_password
    SOLOMON_DATA_DIR: /var/lib/solomon/data
    SOLOMON_JOURNAL_DIR: /var/lib/solomon/journal
    SOLOMON_ZERO_EGRESS_MODE: "true"
    SOLOMON_ALLOW_REMOTE_EGRESS: "false"
  secrets:
    - solomon_server_api_key
    - solomon_content_encryption_key
    - solomon_postgres_password
  volumes:
    - solomon-data:/var/lib/solomon/data
    - solomon-journal:/var/lib/solomon/journal
  depends_on:
    postgres:
      condition: service_healthy
      restart: true
  profiles:
    - production

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_DB: solomon
      POSTGRES_USER: solomon
      POSTGRES_PASSWORD_FILE: /run/secrets/solomon_postgres_password
    secrets:
      - solomon_postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - production

  migrations:
    <<: *solomon
    command: ["solomon", "migrate"]
    restart: "no"

  api:
    <<: *solomon
    command: ["uvicorn", "solomon.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8140"]
    ports:
      - "${SOLOMON_API_BIND:-127.0.0.1:8140}:8140"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8140/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  console:
    <<: *solomon
    command: ["uvicorn", "solomon.console.app:create_console_app", "--factory", "--host", "0.0.0.0", "--port", "8150"]
    ports:
      - "${SOLOMON_CONSOLE_BIND:-127.0.0.1:8150}:8150"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8150/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *solomon
    command: ["solomon", "worker"]
    environment:
      <<: *solomon-environment
      SOLOMON_WORKER_SOURCE_SYNC_INTERVAL_SECONDS: "300"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/solomon-entrypoint solomon health >/dev/null"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

secrets:
  solomon_server_api_key:
    file: ${SOLOMON_SECRETS_DIR:?set SOLOMON_SECRETS_DIR}/server_api_key
  solomon_content_encryption_key:
    file: ${SOLOMON_SECRETS_DIR:?set SOLOMON_SECRETS_DIR}/content_encryption_key
  solomon_postgres_password:
    file: ${SOLOMON_SECRETS_DIR:?set SOLOMON_SECRETS_DIR}/postgres_password

volumes:
  postgres-data:
  solomon-data:
  solomon-journal:
