# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Rust format, lint, and tests
        run: scripts/ci/rust.sh

      - name: MCP conformance and adversarial authorization suite
        run: bash scripts/ci/mcp-conformance.sh

      - name: Administrator bootstrap service smoke test
        run: bash scripts/ci/admin-bootstrap-smoke.sh

      - name: RBAC service smoke test
        run: bash scripts/ci/rbac-smoke.sh

      - name: Service-token smoke test
        run: bash scripts/ci/service-token-smoke.sh

      - name: CORS browser-preflight smoke test
        run: bash scripts/ci/cors-smoke.sh

      - name: Rate-limit service smoke test
        run: bash scripts/ci/rate-limit-smoke.sh

      - name: Semantic-erasure service smoke test
        run: bash scripts/ci/semantic-erasure-smoke.sh

      - name: Multi-repository coding-agent pilot harness
        run: node scripts/ci/multi-repo-pilot-harness.mjs

      - name: Upload MCP conformance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-conformance-${{ matrix.os }}
          path: target/mcp-conformance.json
          if-no-files-found: error

      - name: Python binding smoke test
        run: scripts/ci/python-binding-smoke.sh

      - name: Node binding smoke test
        run: scripts/ci/node-binding-smoke.sh

      - name: Release-gating MCP compatibility matrix
        run: node scripts/ci/mcp-compatibility.mjs

      - name: Upload MCP compatibility matrix
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-compatibility-${{ matrix.os }}
          path: target/mcp-compatibility.json
          if-no-files-found: error

      - name: Golden parity suite
        run: scripts/ci/golden-parity.sh

  perf-smoke:
    name: perf smoke (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Run 1k perf smoke
        run: scripts/ci/perf-smoke.sh
