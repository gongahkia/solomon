# SPDX-License-Identifier: MIT

name: acceptance

on:
  schedule:
    - cron: "43 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - uses: docker/setup-buildx-action@v3
      - name: Run full hostile-condition acceptance suite
        run: bash scripts/ci/acceptance-suite.sh full
