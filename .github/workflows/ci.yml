# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Rust format, lint, and tests
        run: scripts/ci/rust.sh

      - name: MCP conformance and adversarial authorization suite
        run: bash scripts/ci/mcp-conformance.sh

      - name: Upload MCP conformance artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mcp-conformance-${{ matrix.os }}
          path: target/mcp-conformance.json
          if-no-files-found: error

      - name: Python binding smoke test
        run: scripts/ci/python-binding-smoke.sh

      - name: Node binding smoke test
        run: scripts/ci/node-binding-smoke.sh

      - name: Embedded, HTTP, and MCP SDK contract
        run: node scripts/ci/sdk-contract.mjs

      - name: Claude Code MCP configuration fixture
        run: node scripts/ci/claude-code-mcp-fixture.mjs

      - name: Codex MCP configuration fixture
        run: node scripts/ci/codex-mcp-fixture.mjs

      - name: Pi extension API load
        run: npm exec --yes --package @earendil-works/pi-coding-agent@0.80.6 -- pi --offline --no-session --approve --no-extensions --extension .pi/extensions/shibahama-mcp.ts --list-models

      - name: Pi MCP configuration fixture
        run: node scripts/ci/pi-mcp-fixture.mjs

      - name: Golden parity suite
        run: scripts/ci/golden-parity.sh

  perf-smoke:
    name: perf smoke (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Run 1k perf smoke
        run: scripts/ci/perf-smoke.sh
