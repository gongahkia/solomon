# SPDX-License-Identifier: MIT

[workspace]
members = [
    "bindings/node",
    "bindings/python",
    "core",
    "examples/rust/quickstart",
    "shibahama-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gongahkia/shibahama"
homepage = "https://github.com/gongahkia/shibahama"
documentation = "https://github.com/gongahkia/shibahama/tree/main/docs"
readme = "README.md"
keywords = ["agent", "memory", "retrieval", "llm", "temporal"]
categories = ["database", "data-structures"]

[workspace.dependencies]
shibahama-core = { path = "core" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
unwrap_used = "warn"
