<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Solomon Console{% endblock %}</title>
    <link rel="stylesheet" href="/console/static/console.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/console/verification">Solomon</a>
      <nav class="tabs" aria-label="Console">
        <a class="tab {{ 'active' if active_page == 'verification' else '' }}" href="/console/verification">Verification</a>
        <a class="tab {{ 'active' if active_page == 'claims' else '' }}" href="/console/claims">Claims</a>
        <a class="tab {{ 'active' if active_page == 'reviews' else '' }}" href="/console/reviews">Reviews</a>
        <a class="tab {{ 'active' if active_page == 'dependencies' else '' }}" href="/console/dependencies">Dependencies</a>
        <a class="tab {{ 'active' if active_page == 'currency_report' else '' }}" href="/console/currency-report">Currency Report</a>
        <a class="tab {{ 'active' if active_page == 'audit_pack' else '' }}" href="/console/audit-pack">Audit Pack</a>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
