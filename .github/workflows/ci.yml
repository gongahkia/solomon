name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-type-test:
    name: Lint, type-check, and test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run python scripts/check_file_lengths.py
      - run: uv run mypy src tests scripts
      - run: uv run pytest --cov=src/solomon
      - run: uv run python benchmarks/performance_budget.py
      - run: uv run python benchmarks/currency_regression.py

  boundary-smoke:
    name: Vendored boundary smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Run Solomon vendored boundary smoke
        run: |
          uv sync --locked --extra dev
          uv run python scripts/boundary_smoke.py
