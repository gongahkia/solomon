name: Feature request
description: Propose a new Shisa user-facing capability.
title: "feat: "
labels:
  - kind/feat
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What workflow or user scenario does this affect?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why should Shisa support this?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the intended behavior, CLI/config shape, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Concrete requirements that would close this issue.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands, tests, or manual checks expected to prove the feature.
      render: shell
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Related work intentionally left out.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Links to issues, docs, prior art, or external tools.
    validations:
      required: false
