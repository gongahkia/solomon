{{- $secret := required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
{{- if and .Values.oidc.issuer (not .Values.oidc.audience) }}{{ fail "oidc.audience is required when oidc.issuer is set" }}{{ end }}
{{- if and (not .Values.oidc.issuer) (not .Values.secrets.apiKeyKey) }}{{ fail "secrets.apiKeyKey is required without OIDC" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shibahama.fullname" . }}
  labels:
    {{- include "shibahama.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shibahama.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "shibahama.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "shibahama.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: shibahama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: SHIBAHAMA_DIMENSIONS
              value: "2"
            - name: SHIBAHAMA_DATA_PATH
              value: /var/lib/shibahama/shibahama.redb
            - name: SHIBAHAMA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ .Values.secrets.encryptionKeyKey }} }
            - name: SHIBAHAMA_NAMESPACE
              value: {{ .Values.policy.namespace | quote }}
            - name: SHIBAHAMA_RBAC_ENFORCE
              value: {{ .Values.policy.rbacEnforce | quote }}
            - name: SHIBAHAMA_RBAC_ERASURE_MIN_ROLE
              value: {{ .Values.policy.rbacErasureMinRole | quote }}
            - name: SHIBAHAMA_RBAC_PROMOTION_MIN_ROLE
              value: {{ .Values.policy.rbacPromotionMinRole | quote }}
            - name: SHIBAHAMA_RATE_LIMIT_REQUESTS_PER_WINDOW
              value: {{ .Values.policy.rateLimitRequestsPerWindow | quote }}
            - name: SHIBAHAMA_RATE_LIMIT_WINDOW_SECONDS
              value: {{ .Values.policy.rateLimitWindowSeconds | quote }}
            - name: SHIBAHAMA_RATE_LIMIT_BURST
              value: {{ .Values.policy.rateLimitBurst | quote }}
            {{- if .Values.oidc.issuer }}
            - name: SHIBAHAMA_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: SHIBAHAMA_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            - name: SHIBAHAMA_OIDC_PRINCIPAL_CLAIM
              value: {{ .Values.oidc.principalClaim | quote }}
            {{- if .Values.oidc.caConfigMap }}
            - name: SHIBAHAMA_OIDC_CA_CERT_PATH
              value: /etc/shibahama-oidc/{{ .Values.oidc.caKey }}
            {{- end }}
            {{- else }}
            - name: SHIBAHAMA_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ .Values.secrets.apiKeyKey }} }
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/shibahama
            - name: tmp
              mountPath: /tmp
            {{- if .Values.oidc.caConfigMap }}
            - name: oidc-ca
              mountPath: /etc/shibahama-oidc
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "shibahama.fullname" .) .Values.storage.existingClaim }}
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        {{- if .Values.oidc.caConfigMap }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.oidc.caConfigMap }}
            items:
              - key: {{ .Values.oidc.caKey }}
                path: {{ .Values.oidc.caKey }}
        {{- end }}
