name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mdbook:
    name: mdBook / ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.3

      - name: Build docs
        run: mdbook build docs

      - name: Index docs
        run: npx --yes pagefind@1.5.2 --site zig-out/mdbook

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: zig-out/mdbook
          if-no-files-found: error
