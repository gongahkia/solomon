name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Compile sources
        run: python -m compileall src tests
      - name: Smoke installed entrypoints
        run: |
          senko --help
          senko-cards --help
          senko create-deck ci-smoke --force
          senko create-set ci-smoke base
          senko add-card ci-smoke base --name "hello" --info "world"
          senko list-sets ci-smoke
          senko list-cards ci-smoke --set base
          senko stats --deck ci-smoke
          senko export-history "$RUNNER_TEMP/history.jsonl"
      - name: Run tests
        run: python -m unittest discover -s tests
