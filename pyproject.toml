[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks-cli"
version = "1.0.0a1"
description = "Encrypted, local-first portfolio intelligence CLI"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0",
  "mcp>=1.27,<2",
  "platformdirs>=4.2",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]
moomoo = [
  "moomoo-api>=10.9",
]

[project.scripts]
stonks-cli = "stonks_cli.cli:main"
stonks-mcp = "stonks_cli.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501", # line length handled by formatter
  "B904", # raise ... from err
  "E402", # module level import not at top of file
  "B017", # assert blind exception
  "B023", # loop variable not bound
  "B008", # typer.Argument(...) pattern
]

[tool.ruff.lint.isort]
known-first-party = ["stonks_cli"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
