version = 1
theme = "plain"

[prompt]
modules = ["cmd_duration", "git_branch", "language_versions", "user_host", "jobs", "exit_status", "time"]

[modules.language_versions]
detect = ["python", "node", "rust", "go"]

[modules.time]
format = "24h"
utc = true

