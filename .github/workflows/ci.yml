name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DECORUM_STRICT_VISUAL: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show browser version
        run: |
          which google-chrome || true
          which chromium || true
          which chromium-browser || true
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build
