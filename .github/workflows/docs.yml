name: Docs

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  vale:
    name: Vale / docs PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Lint changed docs prose
        uses: vale-cli/vale-action@v2.1.1
        with:
          version: 3.14.0
          files: '["README.md","docs","rfcs"]'
          filter_mode: added
          fail_on_error: true
          level: warning

  mdbook:
    name: mdBook / ubuntu-24.04
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.3

      - name: Build docs
        run: mdbook build docs

      - name: Index docs
        run: npx --yes pagefind@1.5.2 --site zig-out/mdbook

      - name: Upload PR preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: zig-out/mdbook
          if-no-files-found: error

      - name: Configure Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/configure-pages@v6

      - name: Upload release Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/mdbook

  i18n:
    name: i18n catalog gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Validate changed catalogs
        run: bash .github/scripts/i18n-catalog-gate.sh
        env:
          SHISA_BASE_REF: ${{ github.event.pull_request.base.sha }}

  deploy:
    name: pages / release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs:
      - mdbook
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy release docs
        id: deployment
        uses: actions/deploy-pages@v4
