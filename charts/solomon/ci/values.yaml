# SPDX-License-Identifier: Apache-2.0

image:
  repository: registry.example.test/solomon
  tag: test

auth:
  mode: oidc
  oidc:
    issuer: https://idp.example.test
    audience: solomon-api
    roleClaim: roles
    roleMappings:
      firm-admin: admin
      firm-lawyer: lawyer

secrets:
  contentEncryption:
    existingSecret: solomon-content-encryption
    key: key
    keyRef: kms://firm-keyring/solomon-content/v1

database:
  existingSecret: solomon-database
  passwordKey: password

api:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api.solomon.example.test
        paths:
          - path: /
            pathType: Prefix

console:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: console.solomon.example.test
        paths:
          - path: /
            pathType: Prefix

observability:
  openTelemetry:
    enabled: true
    serviceName: solomon-ci
    endpoint: http://otel-collector.observability.svc:4318/v1/traces
