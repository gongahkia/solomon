name: Early-User Feedback
description: Share feedback from trying Shibahama in a real or realistic workflow.
title: "feedback: "
labels:
  - feedback
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to build?
      description: Describe the agent, memory workflow, benchmark, or integration you tried.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface did you use?
      options:
        - Rust core
        - Python binding
        - Node binding
        - Server mode
        - Tideline
        - Benchmarks
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked?
      description: Which parts were clear, useful, or worth keeping?
    validations:
      required: true
  - type: textarea
    id: failed
    attributes:
      label: What failed or felt unclear?
      description: Include setup friction, confusing API points, surprising recall, or missing docs.
    validations:
      required: true
  - type: dropdown
    id: stale_failure
    attributes:
      label: Did Shibahama prevent a stale or repeated-memory failure?
      options:
        - "Yes"
        - "No"
        - "Not tested"
    validations:
      required: true
  - type: textarea
    id: next_try
    attributes:
      label: What would make you try it again?
      description: Name the smallest integration, benchmark, doc, or behavior change that would matter.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust/Python/Node versions, model or embedding setup, and Shibahama commit.
    validations:
      required: true
