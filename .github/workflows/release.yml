name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: mkdir -p dist && GOOS=linux GOARCH=amd64 go build -trimpath -o dist/close-enough-linux-amd64 ./cmd/close-enough
      - run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
