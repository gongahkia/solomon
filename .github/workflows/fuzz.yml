name: Fuzz

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig-fuzz:
    name: zig fuzz / ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: true
          cache-key: fuzz-${{ hashFiles('build.zig.zon') }}

      - name: Run bounded fuzz
        run: |
          set +e
          timeout 60s zig build test --fuzz
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            exit 0
          fi
          exit "$status"
