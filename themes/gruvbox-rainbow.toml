version = 1
name = "gruvbox-rainbow"
extends = "plain"

[capabilities]
color = "ansi256"
glyphs = "ascii"

[palette]
fg = "223"
muted = "245"
accent = "214"
success = "142"
warning = "208"
danger = "167"

[separators]
segment = " "
left = ""
right = ""

[segments.cwd]
fg = "@accent"
bg = ""
style = "bold"
glyph = ""
ascii = ""
suffix = ""

[segments.git_branch]
fg = "@success"
bg = ""
style = ""
glyph = ""
ascii = "git:"
suffix = ""

[segments.exit_status]
fg = "@danger"
bg = ""
style = "bold"
glyph = ""
ascii = "exit:"
suffix = ""

[segments.jobs]
fg = "@warning"
bg = ""
style = ""
glyph = ""
ascii = "jobs:"
suffix = ""

[segments.cmd_duration]
fg = "@muted"
bg = ""
style = ""
glyph = ""
ascii = "took:"
suffix = ""
