# SPDX-License-Identifier: MIT

[package]
name = "shibahama-core"
description = "Rust core for Shibahama, a usage-aware reconstructive memory engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "shibahama_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
blake3 = "1.8.5"
fast-hnsw = "1.0.1"
lz4_flex = "0.13.1"
redb = "4.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde"] }
uuid = { version = "1.23.3", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
