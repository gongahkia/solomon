name: Private beta feedback
description: Track one finding from the 5-tester unpacked-extension beta.
title: "Beta feedback: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Install friction
        - False positive
        - Missed note
        - UX feedback
        - Privacy/disclosure
        - Performance
        - Other
    validations:
      required: true
  - type: input
    id: tester
    attributes:
      label: Tester code
      placeholder: beta-01
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      placeholder: commit SHA, build date
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Chrome version, OS, and install source.
    validations:
      required: true
  - type: input
    id: trace
    attributes:
      label: Trace ID
      description: Required for false positives when available.
      placeholder: trace:...
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redact confidential post text, names, and employer-sensitive details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Proposed next action
    validations:
      required: true
