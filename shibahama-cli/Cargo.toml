# SPDX-License-Identifier: MIT

[package]
name = "shibahama-cli"
description = "Command-line interface for Shibahama."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "shibahama"
path = "src/main.rs"

[features]
default = []
opentelemetry = ["shibahama-core/opentelemetry"]

[dependencies]
axum = "0.8.9"
blake3 = "1.8.3"
clap = { version = "4.6.1", features = ["derive"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shibahama-core.workspace = true
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.7", features = ["cors"] }
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
proptest = "1.9.0"
tempfile = "3.26.0"

[lints]
workspace = true
