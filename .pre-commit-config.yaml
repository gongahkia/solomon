# SPDX-License-Identifier: MIT

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types_or:
          - rust
          - toml
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types:
          - rust
      - id: secret-scan
        name: secret scan
        entry: scripts/ci/secrets-scan.sh
        language: system
        pass_filenames: false
        always_run: true
