<!doctype html>
<html lang="en" data-decorum-fixture="linkedin-feed">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Feed Fixture</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3f2ef;
        color: #191919;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        gap: 12px;
        width: min(640px, calc(100vw - 32px));
        margin: 24px auto;
      }

      .feed-shared-update-v2 {
        border: 1px solid #d6cec2;
        border-radius: 8px;
        padding: 16px;
        background: #ffffff;
      }

      .update-components-actor__name {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .update-components-text {
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <main aria-label="LinkedIn feed">
      <article class="feed-shared-update-v2" data-urn="urn:li:activity:1001">
        <span class="update-components-actor__name">Casey Founder</span>
        <div class="update-components-text">
          Humbled to announce our new growth sprint after 10 years of building.
          Comment YES if you want the playbook.
        </div>
      </article>

      <article class="feed-shared-update-v2" data-urn="urn:li:activity:1002">
        <span class="update-components-actor__name">Priya Analyst</span>
        <div class="update-components-text">
          We published the Q2 support schedule today. The migration window starts on Monday.
        </div>
      </article>
    </main>
  </body>
</html>
