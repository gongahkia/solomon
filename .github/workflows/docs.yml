name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vale:
    name: Vale / docs PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Lint changed docs prose
        uses: vale-cli/vale-action@v2.1.1
        with:
          version: 3.14.0
          files: '["README.md","docs","rfcs"]'
          filter_mode: added
          fail_on_error: true
          level: warning

  i18n:
    name: i18n catalog gate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: i18n-${{ hashFiles('build.zig.zon') }}

      - name: Validate changed catalogs
        run: bash .github/scripts/i18n-catalog-gate.sh
        env:
          SHISA_BASE_REF: ${{ github.event.pull_request.base.sha }}
