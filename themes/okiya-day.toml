version = 1
name = "okiya-day"
extends = "plain"

[capabilities]
color = "ansi256"
glyphs = "ascii"

[palette]
fg = "0"
muted = "240"
accent = "24"
success = "29"
warning = "94"
danger = "124"
bg = "15"

[separators]
segment = " "
left = ""
right = ""

[segments.cwd]
fg = "@accent"
bg = "@bg"
style = "bold"
glyph = ""
ascii = ""
suffix = ""

[segments.git_branch]
fg = "@success"
bg = "@bg"
style = ""
glyph = ""
ascii = "git:"
suffix = ""

[segments.exit_status]
fg = "@danger"
bg = "@bg"
style = "bold"
glyph = ""
ascii = "exit:"
suffix = ""

[segments.jobs]
fg = "@warning"
bg = "@bg"
style = ""
glyph = ""
ascii = "jobs:"
suffix = ""

[segments.cmd_duration]
fg = "@muted"
bg = "@bg"
style = "dim"
glyph = ""
ascii = "took:"
suffix = ""
