name: Performance regression
description: Report a prompt-render, startup, cache, or daemon regression.
title: "perf: "
labels:
  - kind/perf
body:
  - type: textarea
    id: metric
    attributes:
      label: Regressed metric
      description: Include p50/p95/p99 or RSS/CPU deltas.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Benchmark command
      description: Exact command and dataset/repo used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline vs current
      description: Known-good commit/version and regressed commit/version.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, CPU, RAM, disk, shell, terminal, and repo size.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Paste or attach `shisa bench` JSON, logs, and flamegraphs if available.
    validations:
      required: false
