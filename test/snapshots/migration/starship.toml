version = 1
theme = "plain"

[prompt]
modules = ["cwd", "git_branch", "language_versions", "exit_status", "jobs", "cmd_duration", "user_host", "time"]

[modules.language_versions]
detect = ["python", "node", "rust", "go"]

[modules.time]
format = "24h"
utc = true

# Unsupported Starship modules: battery
