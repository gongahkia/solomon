apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "solomon.fullname" . }}-migrations
  labels:
    {{- include "solomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "solomon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      serviceAccountName: {{ include "solomon.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          image: {{ include "solomon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["solomon", "migrate"]
          env:
            {{- include "solomon.appEnvironment" . | nindent 12 }}
          volumeMounts:
            {{- include "solomon.appVolumeMounts" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID"]
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      volumes:
        {{- include "solomon.appVolumes" . | nindent 8 }}
