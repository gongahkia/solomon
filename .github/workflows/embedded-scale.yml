# SPDX-License-Identifier: MIT

name: embedded scale

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-100k:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build Python binding
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade maturin
          cd bindings/python
          python -m maturin develop

      - name: Run embedded 100k scale gate
        run: |
          . .venv/bin/activate
          python benchmarks/embedded-scale.py --check-budget --output target/embedded-scale.json

      - name: Upload scale artifact
        uses: actions/upload-artifact@v6
        with:
          name: embedded-scale
          path: target/embedded-scale.json
