name: Bench

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prompt:
    name: prompt / ubuntu-24.04
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout main baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: bench-${{ hashFiles('head/build.zig.zon') }}

      - name: Install hyperfine
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Benchmark main baseline
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          set -eu
          zig build release
          ./zig-out/bin/shisa bench --export-json ../bench-main.json | tee ../bench-main.txt

      - name: Benchmark head
        working-directory: head
        run: |
          set -eu
          zig build release
          ./zig-out/bin/shisa bench --export-json ../bench-head.json | tee ../bench-head.txt

      - name: Gate pack perf budgets
        working-directory: head
        run: |
          set -eu
          zig build bench | tee ../pack-bench-head.json

      - name: Gate p99 regression
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          ruby -rjson -e '
            def p99(path)
              data = JSON.parse(File.read(path))
              times = data.fetch("results").fetch(0).fetch("times").sort
              abort("#{path}: empty times") if times.empty?
              times[[((times.length * 0.99).ceil - 1), 0].max]
            end
            base = p99("bench-main.json")
            head = p99("bench-head.json")
            limit = base * 1.10
            puts format("main p99: %.6fs", base)
            puts format("head p99: %.6fs", head)
            puts format("limit:    %.6fs", limit)
            abort("p99 regression above 10%") if head > limit
          '

      - name: Build benchmark dashboard
        if: github.event_name == 'push'
        run: |
          set -eu
          mkdir -p site
          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="en">'
            printf '%s\n' '<head>'
            printf '%s\n' '<meta charset="utf-8">'
            printf '%s\n' '<meta name="viewport" content="width=device-width,initial-scale=1">'
            printf '%s\n' '<title>Shisa Prompt Benchmarks</title>'
            printf '%s\n' '<style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem;max-width:960px}pre{background:#111;color:#eee;padding:1rem;overflow:auto}code{background:#eee;padding:.1rem .25rem}</style>'
            printf '%s\n' '</head>'
            printf '%s\n' '<body>'
            printf '%s\n' '<h1>Shisa Prompt Benchmarks</h1>'
            printf '<p>Commit <code>%s</code></p>\n' "$GITHUB_SHA"
            printf '%s\n' '<h2>Head</h2>'
            printf '%s\n' '<pre>'
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' bench-head.txt
            printf '%s\n' '</pre>'
            printf '%s\n' '</body>'
            printf '%s\n' '</html>'
          } > site/index.html

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-bench-${{ github.run_id }}
          path: |
            bench-main.txt
            bench-main.json
            bench-head.txt
            bench-head.json
            pack-bench-head.json
          if-no-files-found: ignore

  deploy:
    name: pages
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs:
      - prompt
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy benchmark dashboard
        id: deployment
        uses: actions/deploy-pages@v4
