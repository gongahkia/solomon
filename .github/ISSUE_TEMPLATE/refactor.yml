name: Refactor
description: Propose a behavior-preserving Shisa code or structure change.
title: "refactor: "
labels:
  - kind/refactor
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this refactor needed?
    validations:
      required: true
  - type: textarea
    id: current-state
    attributes:
      label: Current state
      description: Current LOC, structure, coupling, or ownership problem.
    validations:
      required: true
  - type: textarea
    id: target-state
    attributes:
      label: Target state
      description: Desired module boundaries, ownership, or structure.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Concrete requirements that would close this issue.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands proving behavior is unchanged.
      render: shell
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Related behavior changes intentionally left out.
    validations:
      required: true
