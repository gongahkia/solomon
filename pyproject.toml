# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solomon"
version = "0.1.0"
description = "A good-law engine for a firm's own knowledge, behind a Kaypoh zero-retention boundary."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Solomon contributors" }]
keywords = ["legal-tech", "knowledge-management", "currency", "fastapi"]
dependencies = [
  "fastapi>=0.115.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0,<1.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112.0",
  "mypy>=1.11.2",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
]

[project.scripts]
solomon = "solomon.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/solomon"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
packages = ["solomon"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -W error"
testpaths = ["tests"]
markers = [
  "integration: tests that require a running sibling service",
]

[tool.coverage.run]
branch = true
source = ["src/solomon"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.solomon.kaypoh]
path = "../kaypoh"
client = "src/kaypoh/client.py"
mode = "documented-relative-import"
