{% if items %}
  <div class="review-list">
    {% for row in items %}
      <a
        class="review-row"
        href="/console/verification?item_id={{ row.item.id }}"
        hx-get="/console/verification/items/{{ row.item.id }}"
        hx-target="#preview-panel"
      >
        <span class="row-id">{{ row.item.id }}</span>
        <span class="row-meta">{{ row.item.kind }} · {{ row.currency.currency_state }}</span>
        <span class="row-reason">{{ row.reason }}</span>
        <span class="row-scope">{{ row.reviewer_id or "unassigned" }} · {{ row.verification_status or "requested" }}</span>
      </a>
    {% endfor %}
  </div>
{% else %}
  <div class="empty">No pending verification.</div>
{% endif %}
