version = 1
theme = "plain"

# Tide left items: pwd, git, newline, character
# Tide right items: status, cmd_duration, context, jobs, node, python, rustc, go, aws, gcloud, kubectl, terraform, pulumi, time, bun
[prompt]
modules = ["cwd", "git_branch", "exit_status", "cmd_duration", "user_host", "jobs", "language_versions", "cloud_ctx", "iac_workspace", "time"]

[modules.language_versions]
detect = ["python", "node", "rust", "go"]

[modules.time]
format = "24h"
utc = true

# Unsupported Tide items: bun
