name: RFC Comment Window

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  rfc-comment-window:
    name: RFC comment window
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - run: bash .github/scripts/rfc-comment-window-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
