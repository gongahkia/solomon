# SPDX-License-Identifier: Apache-2.0

name: TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv build --out-dir dist
      - name: Install built wheel and run CLI smoke test
        run: |
          uv venv /tmp/solomon-release-venv
          uv pip install --python /tmp/solomon-release-venv/bin/python dist/*.whl
          /tmp/solomon-release-venv/bin/solomon --version
          /tmp/solomon-release-venv/bin/solomon mcp serve --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/solomon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
