name: release revocation

on:
  workflow_dispatch:
    inputs:
      revoked_version:
        description: release version to revoke
        required: true
        type: string
      replacement_version:
        description: verified replacement release version
        required: true
        type: string
      reason:
        description: public revocation reason
        required: true
        type: string
      confirm:
        description: enter REVOKE to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-revocation
  cancel-in-progress: false

jobs:
  revoke:
    environment: release
    runs-on: ubuntu-latest
    env:
      REVOKED_VERSION: ${{ inputs.revoked_version }}
      REPLACEMENT_VERSION: ${{ inputs.replacement_version }}
      REVOCATION_REASON: ${{ inputs.reason }}
      REVOCATION_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          test "$REVOCATION_CONFIRM" = REVOKE
          go run ./cmd/release-revocation --revoked-version "$REVOKED_VERSION" --replacement-version "$REPLACEMENT_VERSION" --reason "$REVOCATION_REASON" --output "dist/revocations/$REVOKED_VERSION.json"
      - id: notice
        run: |
          set -- dist/revocations/*.json
          test "$#" -eq 1
          test -f "$1"
          printf 'path=%s\n' "$1" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.0
      - run: |
          notice='${{ steps.notice.outputs.path }}'
          cosign sign-blob --yes --bundle "$notice.sigstore.json" "$notice"
          test -s "$notice.sigstore.json"
          cosign verify-blob "$notice" --bundle "$notice.sigstore.json" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-revocation.yml@$GITHUB_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - env:
          TUF_ROOT_PRIVATE_KEY: ${{ secrets.TUF_ROOT_PRIVATE_KEY }}
          TUF_TARGETS_PRIVATE_KEY: ${{ secrets.TUF_TARGETS_PRIVATE_KEY }}
          TUF_SNAPSHOT_PRIVATE_KEY: ${{ secrets.TUF_SNAPSHOT_PRIVATE_KEY }}
          TUF_TIMESTAMP_PRIVATE_KEY: ${{ secrets.TUF_TIMESTAMP_PRIVATE_KEY }}
        run: |
          test -n "$TUF_ROOT_PRIVATE_KEY"
          test -n "$TUF_TARGETS_PRIVATE_KEY"
          test -n "$TUF_SNAPSHOT_PRIVATE_KEY"
          test -n "$TUF_TIMESTAMP_PRIVATE_KEY"
          notice='${{ steps.notice.outputs.path }}'
          go run ./cmd/tuf-metadata --output dist/tuf --version "$GITHUB_RUN_ID" --targets-expires "$(date -u -d '+365 days' +'%Y-%m-%dT%H:%M:%SZ')" --snapshot-expires "$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" --timestamp-expires "$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" --target "$notice" --target "$notice.sigstore.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-revocation-${{ github.run_id }}
          path: dist/revocations/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-revocation-tuf-${{ github.run_id }}
          path: dist/tuf/*.json
          if-no-files-found: error
