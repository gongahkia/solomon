[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "senko-flashcards"
version = "3.0.0"
description = "A local-first terminal flashcard system with TUI and CLI workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "gongahkia" }
]
license = { text = "MIT" }
keywords = ["flashcards", "tui", "cli", "spaced-repetition", "study"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]

[project.scripts]
senko = "main:main"

[tool.setuptools]
py-modules = [
  "analytics",
  "cards",
  "cli",
  "cli_commands",
  "cli_content_commands",
  "cli_history_commands",
  "cli_manage_commands",
  "cli_parser",
  "cli_support",
  "config",
  "deck_browser",
  "deck_ops",
  "deck_screens",
  "history",
  "history_view",
  "import_export",
  "main",
  "review_flow",
  "review_session",
  "rich_content",
  "schema",
  "screen_common",
  "srs",
  "settings_screen",
  "stats_view",
  "storage",
  "transfer_screens",
  "tui",
]

[tool.setuptools.package-dir]
"" = "src"
