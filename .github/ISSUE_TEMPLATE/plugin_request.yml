name: Plugin request
description: Request a core module, official pack module, or marketplace plugin. Graduated-pack requests belong in the pack tracker listed in docs/pack-status.md.
title: "plugin: "
labels:
  - kind/plugin
body:
  - type: input
    id: name
    attributes:
      label: Plugin or module name
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: User value
      description: What prompt state or safety signal should this expose?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data sources
      description: Files, env vars, commands, APIs, or daemon cache inputs required.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Required capabilities
      description: fs_read, fs_watch, exec, net, env_read, pre_exec, secrets.
    validations:
      required: true
  - type: textarea
    id: perf
    attributes:
      label: Performance budget
      description: Expected cold/warm cost and cache invalidation model.
    validations:
      required: true
