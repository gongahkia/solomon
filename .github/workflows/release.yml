name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: mkdir -p dist && GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -buildvcs=false -mod=readonly -ldflags "-X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" -o dist/close-enough ./cmd/close-enough
      - if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          archive=$(sh scripts/release-name.sh "$GITHUB_REF_NAME" linux amd64 tar.gz)
          sh scripts/release-archive.sh dist/close-enough "dist/$archive" "${archive%.tar.gz}"
      - if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          archive=$(sh scripts/release-name.sh "$GITHUB_REF_NAME" linux arm64 tar.gz)
          sh scripts/release-archive.sh dist/close-enough "dist/$archive" "${archive%.tar.gz}"
      - if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        run: |
          archive=$(sh scripts/release-name.sh "$GITHUB_REF_NAME" darwin arm64 tar.gz)
          sh scripts/release-archive.sh dist/close-enough "dist/$archive" "${archive%.tar.gz}"
      - if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        run: |
          archive=$(sh scripts/release-name.sh "$GITHUB_REF_NAME" darwin amd64 tar.gz)
          sh scripts/release-archive.sh dist/close-enough "dist/$archive" "${archive%.tar.gz}"
      - if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          archive=$(sh scripts/release-name.sh "$GITHUB_REF_NAME" windows amd64 zip)
          sh scripts/release-zip.sh dist/close-enough "dist/$archive" "${archive%.zip}"
      - id: release-archive
        run: |
          archive=$(find dist -maxdepth 1 -type f ! -name close-enough -print -quit)
          test -n "$archive"
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - run: |
          archive='${{ steps.release-archive.outputs.path }}'
          case "$archive" in
            *.tar.gz) sbom="${archive%.tar.gz}.cdx.json" ;;
            *.zip) sbom="${archive%.zip}.cdx.json" ;;
            *) exit 2 ;;
          esac
          sh scripts/release-sbom.sh "$(go env GOPATH)/bin/cyclonedx-gomod" . "$sbom" "${{ matrix.goos }}" "${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.cdx.json
          if-no-files-found: error
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: |
          archive='${{ steps.release-archive.outputs.path }}'
          case "$archive" in
            *.tar.gz) audit="${archive%.tar.gz}.licenses.csv" ;;
            *.zip) audit="${archive%.zip}.licenses.csv" ;;
            *) exit 2 ;;
          esac
          sh scripts/release-license-audit.sh "$(go env GOPATH)/bin/go-licenses" . "$audit" "${{ matrix.goos }}" "${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: license-audit-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.licenses.csv
          if-no-files-found: error
      - uses: sigstore/cosign-installer@v4.1.0
      - run: |
          archive='${{ steps.release-archive.outputs.path }}'
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          test -s "$archive.sigstore.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sigstore-bundle-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.sigstore.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.release-archive.outputs.path }}
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release
      - shell: bash
        run: |
          archive=$(find release -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          test -n "$archive"
          sh scripts/release-smoke-test.sh "$archive" "${{ matrix.goos }}" "${{ matrix.goarch }}" "$GITHUB_REF_NAME"
  bundled-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: mkdir -p dist && go build -trimpath -buildvcs=false -mod=readonly -o dist/close-enough ./cmd/close-enough
      - id: bundled-pack
        run: |
          archive=$(sh scripts/release-pack-name.sh "$GITHUB_REF_NAME")
          sh scripts/release-pack-bundle.sh dist/close-enough internal/packs/bundled "dist/$archive" "${archive%.tar.gz}"
          printf 'path=%s\n' "dist/$archive" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.0
      - run: |
          bundle='${{ steps.bundled-pack.outputs.path }}'
          cosign sign-blob --yes --bundle "$bundle.sigstore.json" "$bundle"
          test -s "$bundle.sigstore.json"
          cosign verify-blob "$bundle" --bundle "$bundle.sigstore.json" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-packs-${{ github.ref_name }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-packs-signature-${{ github.ref_name }}
          path: dist/*.sigstore.json
          if-no-files-found: error
  update-manifest:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ github.ref_name }}-linux-amd64
          path: dist/releases/linux-amd64
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ github.ref_name }}-linux-arm64
          path: dist/releases/linux-arm64
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ github.ref_name }}-darwin-amd64
          path: dist/releases/darwin-amd64
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ github.ref_name }}-darwin-arm64
          path: dist/releases/darwin-arm64
      - uses: actions/download-artifact@v5
        with:
          name: release-${{ github.ref_name }}-windows-amd64
          path: dist/releases/windows-amd64
      - id: update-manifest
        run: |
          set -- dist/releases/linux-amd64/*.tar.gz dist/releases/linux-arm64/*.tar.gz dist/releases/darwin-amd64/*.tar.gz dist/releases/darwin-arm64/*.tar.gz dist/releases/windows-amd64/*.zip
          for artifact in "$@"; do test -f "$artifact"; done
          go run ./cmd/update-manifest --channel stable --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --output dist/update/stable.json --artifact "$1" --artifact "$2" --artifact "$3" --artifact "$4" --artifact "$5"
          printf 'path=%s\n' dist/update/stable.json >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.0
      - run: |
          manifest='${{ steps.update-manifest.outputs.path }}'
          cosign sign-blob --yes --bundle "$manifest.sigstore.json" "$manifest"
          test -s "$manifest.sigstore.json"
          cosign verify-blob "$manifest" --bundle "$manifest.sigstore.json" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest-${{ github.ref_name }}
          path: dist/update/stable.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest-signature-${{ github.ref_name }}
          path: dist/update/stable.json.sigstore.json
          if-no-files-found: error
  tuf-registry:
    needs: [bundled-packs, update-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v5
        with:
          name: bundled-packs-${{ github.ref_name }}
          path: dist/targets
      - uses: actions/download-artifact@v5
        with:
          name: bundled-packs-signature-${{ github.ref_name }}
          path: dist/targets
      - uses: actions/download-artifact@v5
        with:
          name: update-manifest-${{ github.ref_name }}
          path: dist/targets
      - uses: actions/download-artifact@v5
        with:
          name: update-manifest-signature-${{ github.ref_name }}
          path: dist/targets
      - env:
          TUF_ROOT_PRIVATE_KEY: ${{ secrets.TUF_ROOT_PRIVATE_KEY }}
          TUF_TARGETS_PRIVATE_KEY: ${{ secrets.TUF_TARGETS_PRIVATE_KEY }}
          TUF_SNAPSHOT_PRIVATE_KEY: ${{ secrets.TUF_SNAPSHOT_PRIVATE_KEY }}
          TUF_TIMESTAMP_PRIVATE_KEY: ${{ secrets.TUF_TIMESTAMP_PRIVATE_KEY }}
        run: |
          test -n "$TUF_ROOT_PRIVATE_KEY"
          test -n "$TUF_TARGETS_PRIVATE_KEY"
          test -n "$TUF_SNAPSHOT_PRIVATE_KEY"
          test -n "$TUF_TIMESTAMP_PRIVATE_KEY"
          set -- dist/targets/*
          test "$#" -eq 4
          for target in "$@"; do test -f "$target"; done
          go run ./cmd/tuf-metadata --output dist/tuf --version "$GITHUB_RUN_ID" --targets-expires "$(date -u -d '+365 days' +'%Y-%m-%dT%H:%M:%SZ')" --snapshot-expires "$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" --timestamp-expires "$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" --target "$1" --target "$2" --target "$3" --target "$4"
      - uses: actions/upload-artifact@v4
        with:
          name: tuf-registry-${{ github.ref_name }}
          path: dist/tuf/*.json
          if-no-files-found: error
