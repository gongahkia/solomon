name: Bug report
description: Report a reproducible Shisa bug.
title: "bug: "
labels:
  - kind/bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal commands, config, shell, and directory state.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shisa version
      placeholder: shisa --version
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - zsh
        - bash
        - fish
        - nushell
        - powershell
        - other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, terminal, architecture, and relevant prompt/plugin config.
    validations:
      required: true
