# SPDX-License-Identifier: Apache-2.0

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests scripts
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest-fast
        entry: uv run pytest -q
        language: system
        pass_filenames: false
      - id: secret-scan
        name: secret scan
        entry: git secrets --scan
        language: system
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: uv run python scripts/check_conventional_commit.py
        language: system
        stages: [commit-msg]
