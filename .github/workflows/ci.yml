name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zig:
    name: zig / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: shisa-${{ hashFiles('build.zig.zon') }}

      - run: zig fmt --check build.zig src/main.zig src/target.zig src/cli/target.zig
      - run: zig build test
      - run: zig build
      - run: zig build release

      - name: verify a matching target fixture
        run: |
          TF_WORKSPACE=production ./zig-out/bin/shisa target inspect payments-prod --config testdata/targets.toml --json | grep '"status":"verified"'

      - name: reject a mismatched target fixture
        run: |
          if TF_WORKSPACE=staging ./zig-out/bin/shisa target run payments-prod --config testdata/targets.toml -- tofu plan; then
            exit 1
          fi
