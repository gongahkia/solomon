# SPDX-License-Identifier: MIT

name: Container

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  hardened-image:
    name: hardened image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and emit provenance/SBOM
        run: bash scripts/ci/container-build.sh

      - name: Run hardened image integration smoke test
        run: bash scripts/ci/container-smoke.sh

      - name: Run OIDC team Compose smoke test
        run: bash scripts/ci/team-compose-smoke.sh

      - name: Upload container attestations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shibahama-container-attestations
          path: target/container
          if-no-files-found: error
