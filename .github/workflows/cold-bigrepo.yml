name: cold big-repo bench

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.zig'
      - 'scripts/cold-bigrepo-bench.sh'
      - '.github/workflows/cold-bigrepo.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cold-bigrepo:
    name: cold render in big repo
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: shisa-cold-bigrepo-${{ hashFiles('build.zig.zon') }}

      - run: brew install hyperfine jq starship
      - run: zig build
      - run: bash scripts/cold-bigrepo-bench.sh
        env:
          SHISA_BIGREPO_COMMITS: 2000
          SHISA_BIGREPO_FILES: 1500
          SHISA_BIGREPO_RUNS: 10
          SHISA_COLD_BUDGET_MS: 150
