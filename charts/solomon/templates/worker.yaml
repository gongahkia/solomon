apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "solomon.fullname" . }}-worker
  labels:
    {{- include "solomon.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "solomon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "solomon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "solomon.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "solomon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["solomon", "worker"]
          env:
            {{- include "solomon.appEnvironment" . | nindent 12 }}
            - name: SOLOMON_WORKER_SOURCE_SYNC_INTERVAL_SECONDS
              value: {{ .Values.worker.sourceSyncIntervalSeconds | quote }}
            - name: SOLOMON_WORKER_SOURCE_SYNC_LIMIT
              value: {{ .Values.worker.sourceSyncLimit | quote }}
          volumeMounts:
            {{- include "solomon.appVolumeMounts" . | nindent 12 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID"]
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "solomon.appVolumes" . | nindent 8 }}
