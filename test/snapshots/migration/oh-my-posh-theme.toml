version = 1
name = "oh-my-posh-imported"
extends = "plain"

[palette]
fg = "#D6DEEB"
muted = "#637777"
accent = "#82AAFF"
success = "#C3E88D"
warning = "#FFCB6B"
danger = "#FF5370"

[segments.cwd]
fg = "@accent"

[segments.git_branch]
fg = "@muted"
prefix = "git:"
suffix = " "

[segments.language_versions]
fg = "@success"
prefix = "py "

[segments.exit_status]
fg = "@danger"
prefix = "exit "

[segments.cmd_duration]
fg = "@warning"
prefix = "took "

[segments.cloud_ctx]
fg = "@accent"
prefix = "aws "
