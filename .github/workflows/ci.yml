name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-type-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python scripts/check_file_lengths.py
      - run: uv run mypy src tests scripts
      - run: uv run pytest
      - run: uv run python benchmarks/performance_budget.py

  boundary-smoke:
    name: Vendored boundary smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Run Solomon vendored boundary smoke
        run: |
          uv sync --extra dev
          uv run python scripts/boundary_smoke.py
