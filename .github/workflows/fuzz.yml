name: Fuzz

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  zig-fuzz:
    name: zig fuzz / ubuntu-24.04
    runs-on: ubuntu-24.04
    env:
      FUZZ_CRASH_AWS_REGION: ${{ vars.FUZZ_CRASH_AWS_REGION || 'us-east-1' }}
      FUZZ_CRASH_AWS_ROLE_ARN: ${{ secrets.FUZZ_CRASH_AWS_ROLE_ARN }}
      FUZZ_CRASH_BUCKET: ${{ secrets.FUZZ_CRASH_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.2
          use-cache: true
          cache-key: fuzz-${{ hashFiles('build.zig.zon') }}

      - name: Run bounded fuzz
        id: fuzz
        shell: bash
        continue-on-error: true
        run: |
          set +e
          timeout 60s zig build test --fuzz 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 124 ]; then
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Bundle fuzz crash details
        id: bundle
        if: steps.fuzz.outputs.status != '0'
        shell: bash
        run: |
          set -eu
          mkdir -p fuzz-crashes
          cp fuzz.log fuzz-crashes/fuzz.log
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'status=%s\n' "${{ steps.fuzz.outputs.status }}"
          } > fuzz-crashes/metadata.txt
          find .zig-cache zig-cache zig-out -type f \( -name '*crash*' -o -name '*repro*' -o -name 'failure-*' -o -name '*.stderr' -o -name '*.stdout' \) 2>/dev/null | sort > fuzz-crashes/cache-files.txt
          if [ -s fuzz-crashes/cache-files.txt ]; then
            tar -czf fuzz-crashes/cache-files.tar.gz -T fuzz-crashes/cache-files.txt
          fi
          bundle="fuzz-crash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$bundle" fuzz-crashes
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload fuzz crash artifact
        if: steps.bundle.outputs.bundle != ''
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.bundle.outputs.bundle }}
          retention-days: 7
          if-no-files-found: error

      - name: Configure crash bucket credentials
        if: steps.bundle.outputs.bundle != '' && env.FUZZ_CRASH_BUCKET != '' && env.FUZZ_CRASH_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.FUZZ_CRASH_AWS_ROLE_ARN }}
          aws-region: ${{ env.FUZZ_CRASH_AWS_REGION }}

      - name: Upload fuzz crash bundle to private bucket
        if: steps.bundle.outputs.bundle != '' && env.FUZZ_CRASH_BUCKET != '' && env.FUZZ_CRASH_AWS_ROLE_ARN != ''
        shell: bash
        run: |
          set -eu
          aws s3 cp "${{ steps.bundle.outputs.bundle }}" "s3://${FUZZ_CRASH_BUCKET}/nightly/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}/${{ steps.bundle.outputs.bundle }}" --only-show-errors

      - name: Fail on fuzz crash
        if: steps.fuzz.outputs.status != '0'
        run: exit "${{ steps.fuzz.outputs.status }}"
